config:
  reload_permission: 'crops.reload'

behaviour:
  replanting:

    # Whether auto replanting is enabled, and if so under what condition
    # Possible values:
    # - ALWAYS -> All players will have their fully grown crops replanted
    # - (Any permission here) -> Only players with this permission will have their fully grown crops replanted
    # - NEVER -> Replanting of fully grown crops is completely disabled
    #
    # HINT: Permission values are useful for rank perks!
    #       To do this, assign a permission here and give it to your rank group.
    # [Defaults to crops.replant]
    allow_fullygrown_replanting: 'crops.replant'

    # Same as allow_fullygrown_replanting, but for crops which are not fully grown
    # [Defaults to crops.replant]
    allow_partgrown_replanting: 'crops.replant'


  harvesting:
    # Whether normal harvesting of crops when fully grown is enabled
    # To prevent Pay to Play gameplay mechanics, we recommend you leave this as ALWAYS.
    # Possible values:
    # - ALWAYS -> All players will be able to harvest crops that are fully grown
    # - (Any permission here) -> Only players with this permission will be able to harvest fully grown crops
    # - NEVER -> No player can harvest fully grown crops
    #
    # WARNING: This only prevents normal harvesting by the player (left click)
    #          It does not prevent breaking the block below, using water or other methods.
    # [Defaults to ALWAYS]
    allow_fullygrown_harvesting: 'ALWAYS'

    # Same as allow_fullygrown_harvesting, but for crops which are not fully grown
    # [Defaults to ALWAYS]
    allow_partgrown_harvesting: 'ALWAYS'




messages:
  # Prefix to be used in plugin messages
  prefix: '&a&lCrops &7» &f'

  # On successful reload
  # [Defaults to &aReloaded configuration files.]
  reload_success: '&aSuccessfully reloaded configuration!'

  # On no permission on reload
  # [Defaults to &cYou do not have permission to do this.]
  reload_no_permission: '&cYou do not have permission to do this.'


  # Controls where harvest+replant, harvest and not fully grown messages display
  # Choose from:
  # - CHAT
  # - ACTIONBAR
  # [Defaults to Chat]
  general_messages:

  # When a fully grown crop is harvested and also replanted
  # (By default, crops are only replanted if a seed is in the player's inventory
  # and the player has the required permission)
  # [Defaults to &2Harvested and replanted crop!]
  harvested_replanted: "&2ʜᴀʀᴠᴇsᴛᴇᴅ & ʀᴇᴘʟᴀɴᴛᴇᴅ ᴄʀᴏᴘ!"

  # When a fully grown crop is harvested but NOT replanted
  # [Defaults to &aHarvested crop!]
  harvested: "&aʜᴀʀᴠᴇsᴛᴇᴅ ᴄʀᴏᴘ"

  # When the crop's break event is cancelled because it is not fully grown
  # [Defaults to &cThis crop is not fully grown.]
  not_fully_grown: '&cʏᴏᴜ ᴄᴀɴ ᴏɴʟʏ ʜᴀʀᴠᴇsᴛ ғᴜʟʟʏ ɢʀᴏᴡɴ ᴄʀᴏᴘs!'




sounds:
  # NOTE: Don't give sounds in the A_B_C format.
  #       Instead, give your sounds in the format a.b.c

  # Sound to play when a fully grown crop is harvested and replanted
  # OFF to disable
  harvested_replanted: 'entity.experience_orb.pickup'

  # Sound to play when a fully grown crop is harvested
  # OFF to disable
  harvested: 'OFF'

  # Sound to play when crop is not harvested because it is not fully grown
  # OFF to disable
  not_fully_grown: 'entity.villager.no'



# Don't change this
config-version: '0.2.1-beta'